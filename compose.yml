---
services:
  db:
    image: kumar49/docker:dbimage
    ports:
      - "3306:3306"
    deploy:
      replicas: 1
  auth_service:
    image: kumar49/docker:authimage
    ports:
      - "5001:5001"
    deploy:
      replicas: 1
    networks:
      - pavan
  book_service:
    image: kumar49/docker:bookimage
    ports:
      - "5002:5002"
    deploy:
      replicas: 1
    networks:
      - pavan
  borrow_service:
    image: kumar49/docker:borrowimage
    ports:
      - "5003:5003"
    deploy:
      replicas: 1
    networks:
      - pavan
  front_service:
    image: kumar49/docker:frontimage
    ports:
      - "5000:5000"
    deploy:
      replicas: 1
    networks:
      - pavan
networks:
  pavan:
    driver: overlay
